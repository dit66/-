<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корочки | Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <nav class="navbar navbar-expand-lg bg-white rounded-3 shadow-sm mb-4">
            <div class="container-fluid">
                <a class="navbar-brand logo" href="index.html">🎓 Корочки</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="login.html">Вход</a></li>
                        <li class="nav-item"><a class="nav-link" href="register.html">Регистрация</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center mb-4">Регистрация</h2>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Логин</label>
                                <input type="text" class="form-control" placeholder="Придумайте логин">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Ваш email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" placeholder="Придумайте пароль">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Подтверждение пароля</label>
                                <input type="password" class="form-control" placeholder="Повторите пароль">
                            </div>
                            <a href="dashboard.html" class="btn btn-primary w-100">Зарегистрироваться</a>
                        </form>
                        <p class="text-center mt-3 mb-0">
                            Уже есть аккаунт? <a href="login.html">Войти</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
